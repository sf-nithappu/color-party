<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Color Party">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Color Party</title>
<link rel="stylesheet" href="shared/kid.css">
<style>
  html, body { overflow: auto; touch-action: manipulation; }
  main {
    min-height: 100%; padding: calc(env(safe-area-inset-top, 0px) + 28px) max(28px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(28px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; justify-content: center;
  }
  #grid {
    display: grid; gap: clamp(16px, 2.6vmin, 30px); justify-content: center;
    grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 30vmin, 340px), 1fr));
    width: 100%; max-width: 1200px;
  }
  .tile {
    position: relative; aspect-ratio: 440 / 320; border-radius: 28px; overflow: hidden; display: block; text-decoration: none;
    background: var(--c, #fde68a); box-shadow: 0 0 0 3px #141414, 0 6px 0 3px #141414;
    transition: transform .15s cubic-bezier(.2, .9, .3, 1), box-shadow .15s;
    -webkit-user-drag: none;
  }
  .tile canvas { position: static; inset: auto; width: 100%; height: 100%; display: block; pointer-events: none; touch-action: auto; }
  .tile .star { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; }
  .tile:active { transform: translateY(4px) scale(.98); box-shadow: 0 0 0 3px #141414, 0 2px 0 3px #141414; }
  @media (hover: hover) { .tile:hover { transform: translateY(-3px) rotate(-.6deg); } .tile:active { transform: translateY(4px) scale(.98); } }
  .tile .badge { position: absolute; left: 12px; bottom: 12px; font-size: 22px; background: #fff; border-radius: 14px; padding: 4px 12px; box-shadow: 0 0 0 2px #141414; }
  /* Parent corner: hold the gear to open settings. */
  #gear { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: 54px; height: 54px; border-radius: 50%; opacity: .35; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 2px #141414; z-index: 5; }
  #gear.holding { opacity: 1; }
  #gear svg { width: 28px; height: 28px; }
  #panel { position: fixed; inset: 0; z-index: 20; background: rgba(20, 22, 26, .35); display: none; place-items: center; padding: 20px; }
  #panel.on { display: grid; }
  #panel .box { background: #fff; border-radius: 22px; padding: 26px; width: min(420px, 100%); box-shadow: 0 0 0 3px #141414; }
  #panel h2 { margin: 0 0 16px; font-weight: 400; font-size: 28px; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #ededed; font-size: 18px; }
  #panel .opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #panel .chip { padding: 8px 14px; border-radius: 12px; background: #f5f5f5; font-size: 16px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
  #panel .chip.sel { background: var(--butter); color: var(--umber); box-shadow: 0 0 0 2px #b45309; }
  #panel .done { margin-top: 14px; width: 100%; height: 50px; border-radius: 14px; background: var(--butter); color: var(--umber); font-size: 18px; }
  #left { font-size: 14px; color: #7a7a7a; text-align: right; margin-top: 6px; }
</style>
</head>
<body data-home="off" data-root="1">
<main><div id="grid"></div></main>
<button id="gear" aria-label="Parents: press and hold">
  <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<div id="panel">
  <div class="box">
    <h2>For parents</h2>
    <div class="row"><span>Sound</span><div class="opts"><button class="chip" data-mute="0">On</button><button class="chip" data-mute="1">Off</button></div></div>
    <div class="row"><span>Play time</span><div class="opts"><button class="chip" data-timer="0">No limit</button><button class="chip" data-timer="10">10 min</button><button class="chip" data-timer="20">20 min</button><button class="chip" data-timer="30">30 min</button></div></div>
    <div id="left"></div>
    <div class="row"><span>Start all pictures again</span><div class="opts"><button class="chip" id="reset">Reset</button></div></div>
    <div class="row" id="fsRow"><span>Full screen</span><div class="opts"><button class="chip" id="fs">Toggle</button></div></div>
    <button class="done" id="close">Done</button>
  </div>
</div>
<script src="shared/shell.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STAR = '<svg class="star" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z" fill="#fcd34d" stroke="#141414" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const scratch = document.createElement('canvas');
function paintTile(cv, pic) {
  const S = 2, ctx = cv.getContext('2d');
  cv.width = 440 * S; cv.height = 320 * S;
  ctx.scale(S, S);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('cp.save.' + pic.slug)); } catch (e) {}
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 440, 320);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = '#141414'; ctx.lineWidth = 3;
  pic.regions.forEach((d, i) => { const p = new Path2D(d); ctx.fillStyle = (saved && saved[i]) || '#fff'; ctx.fill(p); ctx.stroke(p); });
  (pic.deco || []).forEach((d) => ctx.stroke(new Path2D(d)));
}
function build() {
  fetch('pictures/index.json').then((r) => r.json()).then((list) => {
    $('grid').innerHTML = list.map((g) => {
      const done = localStorage.getItem('cp.done.' + g.slug);
      return `<a class="tile" style="--c:${g.color}" href="paint.html?p=${g.slug}" aria-label="${g.name}"><canvas data-s="${g.slug}"></canvas>${done ? STAR : ''}</a>`;
    }).join('');
    list.forEach((g) => fetch('pictures/' + g.slug + '.json').then((r) => r.json()).then((j) => paintTile(document.querySelector(`canvas[data-s="${g.slug}"]`), { slug: g.slug, ...j })).catch(() => {}));
  });
}
build();

// Parent panel: hold the gear for 1.5 seconds.
GK.hold($('gear'), 1500, () => { refresh(); $('panel').classList.add('on'); }, () => {}, null);
$('close').onclick = () => $('panel').classList.remove('on');
$('panel').onclick = (e) => e.target === $('panel') && $('panel').classList.remove('on');
document.querySelectorAll('[data-mute]').forEach((b) => (b.onclick = () => { GK.setMuted(b.dataset.mute === '1'); refresh(); }));
document.querySelectorAll('[data-timer]').forEach((b) => (b.onclick = () => { GK.setTimer(Number(b.dataset.timer)); refresh(); }));
$('reset').onclick = () => { if (confirm('Clear all colouring?')) { Object.keys(localStorage).filter((k) => k.startsWith('cp.')).forEach((k) => localStorage.removeItem(k)); build(); } };
$('fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
if (!document.documentElement.requestFullscreen) { $('fsRow').remove(); }
function refresh() {
  document.querySelectorAll('[data-mute]').forEach((b) => b.classList.toggle('sel', (b.dataset.mute === '1') === GK.muted()));
  const u = GK.until();
  const left = u ? Math.max(0, Math.ceil((u - Date.now()) / 60000)) : 0;
  document.querySelectorAll('[data-timer]').forEach((b) => b.classList.toggle('sel', b.dataset.timer === '0' ? !u : false));
  $('left').textContent = u ? `${left} min left` : '';
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
